
name: JustEat CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # JOB 1: BUILD BACKEND
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ==========================================
  # JOB 2: BUILD FRONTEND
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # JOB 3: TEST BACKEND
  # ==========================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  # ==========================================
  # JOB 4: DOCKER BUILD AND PUSH TO GHCR
  # ==========================================
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend
      - test-backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend Image Metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rida80503/justeat-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Extract Frontend Image Metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rida80503/justeat-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

  # ==========================================
  # JOB 5: DEPLOY APPLICATION
  # ==========================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    needs:
      - docker-publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Backend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Backend deploy hook is not configured."
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            -X POST "$DEPLOY_HOOK"

      - name: Deploy Frontend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Frontend deploy hook is not configured."
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            -X POST "$DEPLOY_HOOK"
