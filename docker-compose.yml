
services:
  postgres:
    image: postgres:14-alpine
    container_name: justeat_db
    environment:
      POSTGRES_DB: ${DB_NAME:-justeat}
      POSTGRES_USER: ${DB_USER:-justeat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-justeat123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - justeat_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justeat_api
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_RELOAD: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: 2
      DATABASE_URL: postgresql://${DB_USER:-justeat}:${DB_PASSWORD:-justeat123}@postgres:5432/${DB_NAME:-justeat}
      JWT_SECRET_KEY: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - justeat_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: justeat_frontend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - justeat_network

volumes:
  postgres_data:

networks:
  justeat_network:
    driver: bridge
